name: Release GLPI Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PLUGIN_NAME: pellissarisync

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Definir versão da release
        id: vars
        run: |
          VERSION=$(grep -oP "\S*'PLUGIN_\w*_VERSION'\,\s*'\K[^']+" setup.php)

          if [ -z "$VERSION" ]; then
            echo "::error::Não foi possível extrair a versão de setup.php"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Criar tar.gz do plugin
        run: |
          TAR_PATH="/tmp/${{ env.PLUGIN_NAME }}.tar.gz"

          tar \
            --create \
            --gzip \
            --file="$TAR_PATH" \
            --exclude='./.git' \
            --exclude='./.github' \
            --transform="s|^\./|${{ env.PLUGIN_NAME }}/|" \
            .

          echo "=== Informações do arquivo ==="
          file "$TAR_PATH"

          echo "=== Primeiros arquivos ==="
          tar -tzf "$TAR_PATH" | head -30

          echo "=== Validando gzip ==="
          gzip -t "$TAR_PATH"

          echo "=== Validando tar ==="
          tar -tzf "$TAR_PATH" >/dev/null

          mv "$TAR_PATH" "./${{ env.PLUGIN_NAME }}.tar.gz"

          echo "=== Artefato final ==="
          file "./${{ env.PLUGIN_NAME }}.tar.gz"

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: "${{ steps.vars.outputs.version }}"
          files: |
            ${{ env.PLUGIN_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
