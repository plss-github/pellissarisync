name: Release GLPI Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PLUGIN_NAME: pellissarisync

jobs:
  # O plugin roda em GLPI 10 e 11, que usam PHP diferentes. Um tarball que não
  # compila em uma das versões só apareceria na instalação do cliente.
  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Checar sintaxe
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "$output"
              status=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.php' -print0)
          exit $status

  build-release:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Definir versão da release
        id: vars
        run: |
          VERSION=$(grep -oP "\S*'PLUGIN_\w*_VERSION'\,\s*'\K[^']+" setup.php)

          # Sem isto, uma mudança no formato do setup.php criaria uma release
          # com tag vazia em vez de falhar.
          if [ -z "$VERSION" ]; then
            echo "::error::Não foi possível extrair a versão de setup.php"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Criar tar.gz do repositório (ignorando .github/.git)
        run: |
          TAR_PATH="/tmp/${{ env.PLUGIN_NAME }}.tar.gz"

          tar -czf "$TAR_PATH" \
            --exclude=.github \
            --exclude=.git \
            --exclude="${{ env.PLUGIN_NAME }}.tar.gz" \
            --transform "s|^|${{ env.PLUGIN_NAME }}/|" \
            .

          mv "$TAR_PATH" "./${{ env.PLUGIN_NAME }}.tar.gz"

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: "${{ steps.vars.outputs.version }}"
          files: |
            ${{ env.PLUGIN_NAME }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
